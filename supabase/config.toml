# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config

project_id = "lte"

[api]
enabled = true

# Port to use for the API URL.
# Using 54341 to avoid conflict with skillpassport (54321) and sso-auth (54331)
port = 54341

schemas = [
  "public",
  "graphql_public",
]

extra_search_path = [
  "public",
  "extensions",
]

max_rows = 1000

[api.tls]
enabled = false

[db]
# Port to use for the local database URL.
# Using 54342 to avoid conflict with skillpassport (54322) and sso-auth (54332)
port = 54342

# Port used by db diff command to initialize the shadow database.
shadow_port = 54340

# The database major version to use. Keep this aligned with your remote database.
major_version = 17

[db.pooler]
enabled = false

port = 54349
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = [
  "./seed/*.sql"
]

[realtime]
enabled = true

[studio]
enabled = true

# Port to use for Supabase Studio.
# Using 54343 to avoid conflict with skillpassport (54323) and sso-auth (54333)
port = 54343

api_url = "http://127.0.0.1:54341"

[inbucket]
enabled = true

# Port to use for the email testing server web interface.
# Using 54344 to avoid conflict with skillpassport (54324) and sso-auth (54334)
port = 54344

[storage]
enabled = true

# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

[auth]
enabled = true

site_url = "http://127.0.0.1:3000"

additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://localhost:3000/**"]

jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8085
deno_version = 2

[analytics]
enabled = false
port = 54345
backend = "postgres"
