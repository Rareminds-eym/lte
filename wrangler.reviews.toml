name = "lte-review-dispatcher"
main = "review-worker/index.ts"
compatibility_date = "2026-06-08"
compatibility_flags = ["nodejs_compat"]
tsconfig = "tsconfig.json"

[triggers]
crons = ["*/5 * * * *"]

[vars]
SKILLPASSPORT_INTERNAL_URL = "https://skillpassport.rareminds.in"

[[services]]
binding = "SSO_SERVICE"
service = "sso-api"
entrypoint = "SsoWorker"

[[queues.producers]]
binding = "LTE_SYNC_QUEUE"
queue = "lte-db-sync-queue"

[observability]
enabled = true

# Required secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# SKILLPASSPORT_INTERNAL_SECRET. There is no global on/off flag: each
# class/program is controlled by its administrator in SkillPassport. Deploy order:
# LTE and SkillPassport migrations, then the queue consumer, then this worker and LTE.
