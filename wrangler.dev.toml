# Wrangler configuration for LTE Cloudflare Pages Functions (Dev Environment).

pages_build_output_dir = "dist"
name = "lte-app-dev"
compatibility_date = "2026-06-08"
compatibility_flags = ["nodejs_compat"]

# ============================================================================
# LOCAL DEV
# ============================================================================

[dev]
port = 8789
host = "127.0.0.1"
inspector_port = 9228

# ============================================================================
# LOCAL BINDINGS
# ============================================================================

[[services]]
binding = "SSO_SERVICE"
service = "sso-api-dev"
entrypoint = "SsoWorker"

[[queues.producers]]
queue = "lte-db-sync-queue-dev"
binding = "LTE_SYNC_QUEUE"

[[r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "lte"

[vars]
ENVIRONMENT = "development"
SSO_WORKER_LOCAL_URL = "http://localhost:8787"
COOKIE_DOMAIN = ".rareminds.in"
SKILLPASSPORT_INTERNAL_URL = "http://localhost:8788"
R2_PUBLIC_DOMAIN = "https://bucket.lte.rareminds.in"

# ============================================================================
# DEV ENVIRONMENT BINDINGS (Maps to Production branch on lte-dev Project)
# ============================================================================

[env.production.vars]
ENVIRONMENT = "development"
SKILLPASSPORT_INTERNAL_URL = "https://skillpassport-dev.pages.dev"
R2_PUBLIC_DOMAIN = "https://bucket.lte.rareminds.in"

[[env.production.services]]
binding = "SSO_SERVICE"
service = "sso-api-dev"
entrypoint = "SsoWorker"

[[env.production.queues.producers]]
queue = "lte-db-sync-queue-dev"
binding = "LTE_SYNC_QUEUE"

[[env.production.r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "lte-dev"


