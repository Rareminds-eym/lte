# Wrangler configuration for LTE Cloudflare Pages Functions.
# SSO owns auth-code Durable Object storage; LTE consumes SSO through RPC.

name = "lte"
compatibility_date = "2026-06-08"
compatibility_flags = ["nodejs_compat"]

# ============================================================================
# LOCAL DEV
# ============================================================================

[dev]
port = 8789
host = "127.0.0.1"
inspector_port = 9228

# ============================================================================
# LOCAL BINDINGS
# ============================================================================

# Local development uses an emulated namespace; no remote KV writes.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "local-lte-rate-limits"

[[services]]
binding = "SSO_SERVICE"
service = "sso-api"
entrypoint = "SsoWorker"

[[queues.producers]]
queue = "lte-db-sync-queue"
binding = "LTE_SYNC_QUEUE"

[[r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "lte"

[vars]
CF_ACCOUNT_ID = "ad91abcd16cd9e9c569d83d9ef46e398"
ENVIRONMENT = "production"
SSO_WORKER_LOCAL_URL = "http://localhost:8787"
COOKIE_DOMAIN = ".rareminds.in"
SKILLPASSPORT_INTERNAL_URL = "http://localhost:8788"
CERTIFICATE_VERIFY_BASE_URL = "http://localhost:8788/verify"
R2_PUBLIC_DOMAIN = "https://bucket.lte.rareminds.in"

# ============================================================================
# PRODUCTION BINDINGS
# ============================================================================

[env.production.vars]
CF_ACCOUNT_ID = "ad91abcd16cd9e9c569d83d9ef46e398"
ENVIRONMENT = "production"
COOKIE_DOMAIN = ".rareminds.in"
SKILLPASSPORT_INTERNAL_URL = "https://skillpassport.rareminds.in"
CERTIFICATE_VERIFY_BASE_URL = "https://skillpassport.rareminds.in/verify"
R2_PUBLIC_DOMAIN = "https://bucket.lte.rareminds.in"

# Replace with the dedicated production namespace ID before deployment.
[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "a162f140e4464515a8d5a27b5ebc6c6b"

[[env.production.services]]
binding = "SSO_SERVICE"
service = "sso-api"
entrypoint = "SsoWorker"

[[env.production.queues.producers]]
queue = "lte-db-sync-queue"
binding = "LTE_SYNC_QUEUE"

[[env.production.r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "lte"

# ============================================================================
# PREVIEW BINDINGS
# ============================================================================

[env.preview.vars]
CF_ACCOUNT_ID = "ad91abcd16cd9e9c569d83d9ef46e398"
ENVIRONMENT = "development"
SKILLPASSPORT_INTERNAL_URL = "https://skillpassport-dev.pages.dev"
CERTIFICATE_VERIFY_BASE_URL = "https://skillpassport-dev.pages.dev/verify"
R2_PUBLIC_DOMAIN = "https://bucket.lte.rareminds.in"

# Keep preview traffic in a separate namespace from production.
[[env.preview.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "a01a250ae61941a6adb3b4c702b6ea2f"

[[env.preview.services]]
binding = "SSO_SERVICE"
service = "sso-api-dev"
entrypoint = "SsoWorker"

[[env.preview.queues.producers]]
queue = "lte-db-sync-queue-dev"
binding = "LTE_SYNC_QUEUE"

[[env.preview.r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "lte"

# ============================================================================
# SECRETS
# ============================================================================
# For local development: add secrets to .dev.vars.
# For production/preview: wrangler pages secret put <KEY_NAME> --project-name lte
# - BROWSER_RENDERING_API_TOKEN (Browser Rendering – Edit)
# CF_ACCOUNT_ID must be configured per environment before deploy (32-hex account identifier).
#
# Required:
# - SUPABASE_URL
# - SUPABASE_SERVICE_ROLE_KEY
