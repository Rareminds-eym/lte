# Wrangler configuration for LTE Cloudflare Pages Functions.
# SSO owns auth-code Durable Object storage; LTE consumes SSO through RPC.

name = "lte"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
logs.head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# ============================================================================
# LOCAL DEV
# ============================================================================

[dev]
port = 8789
host = "127.0.0.1"
inspector_port = 9228

# ============================================================================
# LOCAL BINDINGS
# ============================================================================

[[services]]
binding = "SSO_SERVICE"
service = "sso-api"
entrypoint = "SsoWorker"

[[queues.producers]]
queue = "lte-db-sync-queue"
binding = "LTE_SYNC_QUEUE"

[[r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "lte"

[vars]
ENVIRONMENT = "development"
SSO_WORKER_LOCAL_URL = "http://localhost:8787"
COOKIE_DOMAIN = ".rareminds.in"
SKILLPASSPORT_INTERNAL_URL = "http://localhost:8788"
R2_PUBLIC_DOMAIN = "https://bucket.lte.rareminds.in"

# ============================================================================
# PRODUCTION BINDINGS
# ============================================================================

[env.production.vars]
ENVIRONMENT = "production"
COOKIE_DOMAIN = ".rareminds.in"
SKILLPASSPORT_INTERNAL_URL = "https://skillpassport.rareminds.in"
R2_PUBLIC_DOMAIN = "https://bucket.lte.rareminds.in"

[[env.production.services]]
binding = "SSO_SERVICE"
service = "sso-api"
entrypoint = "SsoWorker"

[[env.production.queues.producers]]
queue = "lte-db-sync-queue"
binding = "LTE_SYNC_QUEUE"

[[env.production.r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "lte"

# ============================================================================
# PREVIEW BINDINGS
# ============================================================================

[env.preview.vars]
ENVIRONMENT = "development"
SKILLPASSPORT_INTERNAL_URL = "https://skillpassport-dev.pages.dev"
R2_PUBLIC_DOMAIN = "https://bucket.lte.rareminds.in"

[[env.preview.services]]
binding = "SSO_SERVICE"
service = "sso-api-dev"
entrypoint = "SsoWorker"

[[env.preview.queues.producers]]
queue = "lte-db-sync-queue-dev"
binding = "LTE_SYNC_QUEUE"

[[env.preview.r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "lte"

# ============================================================================
# SECRETS
# ============================================================================
# For local development: add secrets to .dev.vars.
# For production: set secrets using `wrangler secret put <KEY_NAME>` or dashboard.
#
# Required:
# - SUPABASE_URL
# - SUPABASE_SERVICE_ROLE_KEY
