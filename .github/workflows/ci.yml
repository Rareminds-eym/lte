name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Configure NPM for CI
        run: |
          rm -f .npmrc
          npm config set legacy-peer-deps true
          npm config set ignore-scripts true

      - name: Install Required Packages
        run: npm install --no-save eslint@9.27.0 typescript@5.9.3 vitest@4.1.0 @types/node@25.5.0

      - name: Validate File Types
        run: npm run lint:files

      - name: Detect Console Usage
        run: npm run lint:console

      - name: Run ESLint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Run Tests
        run: npm run test

