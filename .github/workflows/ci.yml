name: CI

on:
  push:
    branches: [main, production, dev]
  pull_request:
    branches: [main, production, dev]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Validate File Types
        run: npm run lint:files

      - name: Detect Console Usage
        run: npm run lint:console

      - name: Lint TypeScript - Changed Files Only
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -z "${BASE_REF}" ]; then
            echo "Skipping changed-file TypeScript lint because github.base_ref is empty"
            exit 0
          fi
          git fetch origin "${BASE_REF}"
          CHANGED_TS=$(git diff --name-only --diff-filter=d "origin/${BASE_REF}...HEAD" -- '*.ts' '*.tsx' 2>/dev/null | grep -v node_modules || echo "")
          if [ -z "$CHANGED_TS" ]; then
            echo "✓ No TypeScript files changed"
            exit 0
          fi
          echo "Linting changed TypeScript files:"
          echo "$CHANGED_TS"
          echo "$CHANGED_TS" | tr '\n' '\0' | xargs -0 npx eslint --max-warnings 0

      - name: Lint CSS - Changed Files Only
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -z "${BASE_REF}" ]; then
            echo "Skipping changed-file CSS lint because github.base_ref is empty"
            exit 0
          fi
          git fetch origin "${BASE_REF}"
          CHANGED_CSS=$(git diff --name-only --diff-filter=d "origin/${BASE_REF}...HEAD" -- '*.css' 2>/dev/null | grep -v node_modules || echo "")
          if [ -z "$CHANGED_CSS" ]; then
            echo "✓ No CSS files changed"
            exit 0
          fi
          echo "Linting changed CSS files:"
          echo "$CHANGED_CSS"
          echo "$CHANGED_CSS" | tr '\n' '\0' | xargs -0 npx stylelint --max-warnings 0

      - name: Type Check
        run: npm run typecheck

      - name: Run Tests
        run: npm run test

