# ============================================================================

# PROJECT ARCHITECTURE AND ENFORCEMENT RULES

# ============================================================================

# This file defines the approved technology stack, directory responsibilities,

# FSD import boundaries, frontend/backend separation, security requirements,

# state-management rules, validation rules, and review standards.

#

# These rules must be followed by developers, AI coding assistants, reviewers,

# CI pipelines, and automated code-generation tools.

# ============================================================================

stack:
language: typescript
language_version: "5.5.3"
strict_mode: true

framework: react
framework_version: "18.3.1"

bundler: vite
bundler_version: "5.4.2"

architecture: feature-sliced-design

routing:
library: react-router-dom
version: "7.9.4"
type: spa-client-routing

backend:
platform: cloudflare-pages-functions
workers_allowed: false
deployment_model: serverless-pages-functions

state_management:
client_state: zustand
client_state_version: "5.0.8"
server_state: tanstack-query
server_state_version: "5.90.3"

database:
provider: supabase
version: "2.57.4"
direct_auth_allowed: false
allowed_usage:
- database
- realtime
- storage

authentication:
frontend_client: "@rareminds-eym/auth-client"
backend_core: "@rareminds-eym/auth-core"
direct_supabase_auth_allowed: false

styling:
framework: tailwindcss
version: "4.0.0"
component_primitives: radix-ui
animations: framer-motion

forms_and_validation:
schema_validation: zod

ui:
charting: recharts

integrations:
ai: openai
payments: razorpay

testing:
runner: vitest
runner_version: "1.6.1"
component_testing: react-testing-library

